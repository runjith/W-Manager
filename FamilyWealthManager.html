<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1c1917"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Family Wealth & Asset Manager</title>
<style>
:root {
  --bg: #efe8dc;
  --bg-elevated: #f7f3ea;
  --bg-subtle: #e7dfd0;
  --bg-inverse: #1c1917;
  --fg: #1c1917;
  --fg-muted: #6f675e;
  --fg-subtle: #8a8278;
  --fg-inv: #ece7de;
  --border: color-mix(in oklab, var(--fg) 12%, transparent);
  --border-strong: color-mix(in oklab, var(--fg) 22%, transparent);
  --accent: #234e49;
  --accent-fg: #f7f3ea;
  --accent-soft: color-mix(in oklab, var(--accent) 12%, transparent);
  --profit: #1f6b45;
  --loss: #a33b32;
  --warn: #8a5a10;
  --info: #2c4a6e;
  --overlay: color-mix(in oklab, var(--fg) 42%, transparent);
  --shadow: 0 1px 2px color-mix(in oklab, var(--fg) 6%, transparent), 0 12px 32px color-mix(in oklab, var(--fg) 8%, transparent);
  --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-body: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --font-mono: "SF Mono", "Cascadia Mono", ui-monospace, Menlo, Consolas, monospace;
  --text-xs: 0.75rem; --text-sm: 0.8125rem; --text-base: 0.9375rem; --text-lg: 1.125rem; --text-xl: 1.5rem; --text-2xl: 2rem;
  --leading: 1.5; --leading-tight: 1.2;
  --nav-w: 232px; --top-h: 58px; --filter-h: 52px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --motion-quick: 150ms; --motion-fast: 250ms; --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
[data-theme="dark"] {
  --bg: #101112; --bg-elevated: #181a1c; --bg-subtle: #222426; --bg-inverse: #ece7de;
  --fg: #ece7de; --fg-muted: #9a9388; --fg-subtle: #7a746c; --fg-inv: #1c1917;
  --accent: #c5d0c9; --accent-fg: #141615; --accent-soft: color-mix(in oklab, var(--accent) 14%, transparent);
  --profit: #5dba86; --loss: #e07068; --warn: #d4a017; --info: #8eafd4;
  --overlay: rgba(0,0,0,.62);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101112; --bg-elevated: #181a1c; --bg-subtle: #222426; --bg-inverse: #ece7de;
    --fg: #ece7de; --fg-muted: #9a9388; --fg-subtle: #7a746c; --fg-inv: #1c1917;
    --accent: #c5d0c9; --accent-fg: #141615; --accent-soft: color-mix(in oklab, var(--accent) 14%, transparent);
    --profit: #5dba86; --loss: #e07068; --warn: #d4a017; --info: #8eafd4;
    --overlay: rgba(0,0,0,.62);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading);
  color: var(--fg);
  background: var(--bg);
  min-height: 100dvh;
  min-height: 100svh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
h1,h2,h3,h4 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.03em; line-height: var(--leading-tight); margin: 0; }
.tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.mono { font-family: var(--font-mono); }
#app { min-height: 100dvh; }
#sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--nav-w);
  background: var(--bg-elevated); border-right: 1px solid var(--border);
  padding: calc(18px + var(--safe-t)) 12px calc(16px + var(--safe-b));
  display: flex; flex-direction: column; gap: 4px; z-index: 40;
  overflow: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 18px; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 8px; background: var(--bg-inverse); color: var(--fg-inv);
  display: grid; place-items: center; flex-shrink: 0;
}
.brand-mark svg { width: 18px; height: 18px; }
.brand h1 { font-size: 0.92rem; letter-spacing: -0.02em; }
.brand p { margin: 2px 0 0; font-size: 0.68rem; color: var(--fg-subtle); font-family: var(--font-body); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
.nav-sec { font-size: 0.65rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-subtle); padding: 14px 12px 6px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  border: 0; background: transparent; color: var(--fg-muted);
  padding: 9px 12px; border-radius: var(--radius-sm); text-align: left;
  transition: background var(--motion-quick) var(--ease), color var(--motion-quick) var(--ease);
}
.nav-btn:hover { background: var(--bg-subtle); color: var(--fg); }
.nav-btn.active { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.nav-btn .ic { opacity: .85; flex-shrink: 0; }
.nav-sub { margin-left: 22px; }
#main {
  margin-left: var(--nav-w);
  min-height: 100dvh;
  display: flex; flex-direction: column;
  padding-left: var(--safe-l); padding-right: var(--safe-r);
}
#topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: calc(10px + var(--safe-t)) 20px 10px;
  display: flex; align-items: center; gap: 10px; min-height: calc(var(--top-h) + var(--safe-t));
}
.menu-btn { display: none; }
#content { padding: 20px 22px calc(32px + var(--safe-b)); flex: 1; max-width: 1400px; width: 100%; }
.icon-btn, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--border); background: var(--bg-elevated); color: var(--fg);
  border-radius: var(--radius-sm); padding: 0 14px; height: 40px;
  transition: transform var(--motion-quick) var(--ease), background var(--motion-quick) var(--ease), border-color var(--motion-quick) var(--ease);
}
.icon-btn { width: 40px; padding: 0; flex-shrink: 0; }
.icon-btn:hover, .btn:hover { border-color: var(--border-strong); }
.icon-btn:active, .btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.danger { background: var(--loss); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { height: 32px; padding: 0 10px; font-size: var(--text-sm); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
#filterbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 0 22px 12px; position: sticky; top: calc(var(--top-h) + var(--safe-t)); z-index: 20;
  background: var(--bg);
}
.filter-dd { position: relative; }
.filter-dd > button, .seg {
  height: 36px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-elevated);
  padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--fg);
}
.seg { padding: 3px; gap: 2px; }
.seg button {
  height: 28px; border: 0; background: transparent; color: var(--fg-muted); border-radius: 999px; padding: 0 12px; font-size: var(--text-sm);
}
.seg button.active { background: var(--bg-inverse); color: var(--fg-inv); font-weight: 600; }
.dd-panel {
  position: absolute; top: calc(100% + 6px); left: 0; min-width: 240px; max-height: 320px; overflow: auto;
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow); padding: 8px; z-index: 50;
  transform-origin: top left; animation: pop var(--motion-fast) var(--ease);
}
.dd-panel label { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: var(--radius-xs); cursor: pointer; font-size: var(--text-sm); }
.dd-panel label:hover { background: var(--bg-subtle); }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.card {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-xl);
  padding: 18px;
}
.card h3 { font-size: 0.72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-subtle); font-family: var(--font-body); font-weight: 650; margin-bottom: 10px; }
.kpi-val { font-family: var(--font-display); font-size: 1.55rem; letter-spacing: -0.03em; }
.kpi-sub { margin-top: 8px; font-size: var(--text-sm); color: var(--fg-muted); display: flex; flex-wrap: wrap; gap: 10px; }
.pos { color: var(--profit); } .neg { color: var(--loss); } .muted { color: var(--fg-muted); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-head h2 { font-size: clamp(1.4rem, 1.1rem + 1.2vw, 1.85rem); }
.page-head p { color: var(--fg-muted); margin: 4px 0 0; font-size: var(--text-sm); }
.tabs { display: flex; gap: 4px; overflow: auto; padding-bottom: 2px; margin-bottom: 16px; }
.tabs button {
  border: 0; background: transparent; color: var(--fg-muted); padding: 8px 12px; border-bottom: 2px solid transparent; white-space: nowrap;
}
.tabs button.active { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }
.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-elevated); }
table.data { width: 100%; border-collapse: collapse; font-size: var(--text-sm); min-width: 640px; }
table.data th {
  text-align: left; font-weight: 600; font-size: 0.68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-subtle);
  padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg-subtle); white-space: nowrap; position: sticky; top: 0;
}
table.data td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover { background: color-mix(in oklab, var(--accent) 5%, transparent); }
table.data .num { text-align: right; font-variant-numeric: tabular-nums; }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; }
.empty {
  text-align: center; padding: 48px 20px; color: var(--fg-muted);
  border: 1px dashed var(--border-strong); border-radius: var(--radius-xl); background: var(--bg-elevated);
}
.empty h3 { font-size: 1.2rem; color: var(--fg); margin-bottom: 6px; }
.empty p { margin: 0 0 16px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field label { display: block; font-size: var(--text-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; height: 40px; border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm); padding: 0 10px;
}
.field textarea { height: auto; min-height: 88px; padding: 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid color-mix(in oklab, var(--accent) 45%, transparent); outline-offset: 1px; border-color: var(--accent);
}
.help { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 4px; }
.error-text { color: var(--loss); font-size: var(--text-sm); }
#modal-root, #lock-screen {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px;
  background: var(--overlay);
}
#modal-root { align-items: start; padding-top: max(24px, var(--safe-t)); overflow: auto; }
.modal {
  width: min(720px, 100%); background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-xl);
  box-shadow: var(--shadow); padding: 22px; margin: auto; animation: modal-in var(--motion-fast) var(--ease);
}
.modal h3 { font-size: 1.25rem; margin-bottom: 4px; }
.modal .sub { color: var(--fg-muted); font-size: var(--text-sm); margin-bottom: 16px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
#lock-screen {
  z-index: 100; background: var(--bg); place-items: center;
}
.lock-card { width: min(380px, 100%); text-align: center; }
.lock-card h2 { font-size: 1.8rem; margin: 12px 0 8px; }
.lock-pin { display: flex; gap: 8px; justify-content: center; margin: 18px 0; }
.lock-pin input {
  width: 44px; height: 52px; text-align: center; font-size: 1.4rem; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg-elevated); font-variant-numeric: tabular-nums;
}
.toast-wrap { position: fixed; right: 16px; bottom: calc(16px + var(--safe-b)); z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--bg-inverse); color: var(--fg-inv); padding: 10px 14px; border-radius: var(--radius-md);
  box-shadow: var(--shadow); font-size: var(--text-sm); animation: pop var(--motion-fast) var(--ease);
}
.toast.err { background: var(--loss); color: #fff; }
.toast.ok { background: var(--profit); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--bg-subtle); font-size: var(--text-xs); font-weight: 600; }
.chip.warn { background: color-mix(in oklab, var(--warn) 18%, transparent); color: var(--warn); }
.chip.ok { background: color-mix(in oklab, var(--profit) 16%, transparent); color: var(--profit); }
.chip.bad { background: color-mix(in oklab, var(--loss) 16%, transparent); color: var(--loss); }
.alloc-row { display: grid; grid-template-columns: 1fr 90px 36px; gap: 8px; margin-bottom: 8px; align-items: center; }
.search-overlay {
  position: fixed; inset: 0; z-index: 70; background: var(--overlay); display: grid; align-items: start; justify-items: center;
  padding: calc(12vh + var(--safe-t)) 16px 16px;
}
.search-box { width: min(640px, 100%); background: var(--bg-elevated); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
.search-box input { width: 100%; height: 52px; border: 0; background: transparent; padding: 0 16px; outline: none; }
.search-res { max-height: 50vh; overflow: auto; border-top: 1px solid var(--border); }
.search-res button { width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 16px; display: block; }
.search-res button:hover { background: var(--bg-subtle); }
.search-res small { color: var(--fg-subtle); }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.legend { list-style: none; margin: 0; padding: 0; font-size: var(--text-sm); }
.legend li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
.swatch { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 8px; }
.two-col { display: grid; grid-template-columns: 1.4fr .8fr; gap: 12px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.live-calc { background: var(--bg-subtle); border-radius: var(--radius-md); padding: 12px 14px; font-size: var(--text-sm); }
.live-calc div { display: flex; justify-content: space-between; padding: 3px 0; }
.hint { font-size: var(--text-xs); color: var(--fg-subtle); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; font-size: var(--text-sm); color: var(--fg-muted); }
.bottom-nav { display: none; }
.warn-banner {
  border: 1px solid color-mix(in oklab, var(--warn) 40%, var(--border));
  background: color-mix(in oklab, var(--warn) 10%, var(--bg-elevated));
  border-radius: var(--radius-md); padding: 12px 14px; font-size: var(--text-sm); margin-bottom: 12px;
}
.preview-table { max-height: 280px; overflow: auto; font-size: var(--text-xs); }
.stat-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.stat-line:last-child { border-bottom: 0; }
.bar { height: 8px; background: var(--bg-subtle); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.privacy .maskable { font-family: var(--font-mono); letter-spacing: .2em; }
#boot { min-height: 100dvh; display: grid; place-items: center; color: var(--fg-muted); }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes modal-in { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
@media (max-width: 980px) {
  #sidebar {
    transform: translateX(-110%); transition: transform var(--motion-fast) var(--ease);
    box-shadow: var(--shadow);
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar-backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 35; }
  #main { margin-left: 0; padding-bottom: calc(64px + var(--safe-b)); }
  .menu-btn { display: inline-flex; }
  #content { padding: 16px 14px calc(24px + var(--safe-b)); }
  #filterbar { padding: 0 14px 10px; }
  #topbar { padding-left: 12px; padding-right: 12px; }
  .form-grid, .chart-row, .two-col, .split { grid-template-columns: 1fr; }
  .bottom-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
    background: var(--bg-elevated); border-top: 1px solid var(--border);
    padding: 6px 8px calc(6px + var(--safe-b)); justify-content: space-around;
  }
  .bottom-nav button {
    border: 0; background: transparent; color: var(--fg-muted); display: flex; flex-direction: column; align-items: center;
    gap: 2px; font-size: 0.65rem; min-width: 56px; min-height: 44px; padding: 4px;
  }
  .bottom-nav button.active { color: var(--fg); font-weight: 600; }
  .modal { width: 100%; border-radius: var(--radius-xl) var(--radius-xl) 0 0; margin-top: auto; max-height: 92dvh; overflow: auto; }
  #modal-root { align-items: end; padding: 0; }
  table.data { min-width: 0; }
  table.data thead { display: none; }
  table.data, table.data tbody, table.data tr, table.data td { display: block; width: 100%; }
  table.data tr { padding: 12px; border-bottom: 1px solid var(--border); }
  table.data td { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border: 0; text-align: right; }
  table.data td::before { content: attr(data-label); color: var(--fg-subtle); font-size: 0.72rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; text-align: left; }
  table.data td.num { text-align: right; }
}
@media (min-width: 981px) {
  #sidebar-backdrop { display: none !important; }
}
</style>
</head>
<body>
<div id="boot">Opening ledger…</div>
<div id="lock-screen" hidden>
  <div class="lock-card">
    <div class="brand-mark" style="margin:0 auto;width:48px;height:48px;border-radius:12px"></div>
    <h2>Family ledger locked</h2>
    <p class="muted">Enter your PIN to view this device’s private records. This is a local privacy lock, not bank-grade security.</p>
    <div class="lock-pin" id="lock-pin"></div>
    <p class="error-text" id="lock-err" hidden>Incorrect PIN</p>
  </div>
</div>
<div id="app" hidden>
  <aside id="sidebar"></aside>
  <div id="sidebar-backdrop" hidden></div>
  <div id="main">
    <header id="topbar"></header>
    <div id="filterbar"></div>
    <div id="content"></div>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>
<div id="modal-root" hidden></div>
<div id="search-overlay" class="search-overlay" hidden></div>
<div class="toast-wrap" id="toasts"></div>
<script>
(function () {
'use strict';
const APP = 'FamilyWealthManager';
const APP_VERSION = '1.0.0';
const DB_NAME = 'FamilyWealthDB';
const DB_VERSION = 1;
const CENTS_PER_ACRE = 100;
const PAGE_SIZE = 80;
const ACTIVITY_CAP = 4000;

const OWNERSHIP_STATUSES = ['Owned','Jointly Owned','Gift Intended','Gift Process Started','Gift Completed','Transfer Pending','Inherited','Purchased','Disputed','Other'];
const PROPERTY_TYPES = ['Agricultural Land','Land','Site','House Site','Farm','Other'];
const ACQ_METHODS = ['Purchased','Inherited','Gifted','Partition','Other'];
const CROPS = ['Coconut','Paddy','Fish','Mixed','Fallow','Other'];
const AGRI_EXP_CATS = ['Fertilizer','Plowing','Water','Irrigation','Seeds','Medicine','Labor','Other'];

function uid() { return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => {
    if (c === '&') return '&' + 'amp;';
    if (c === '<') return '&' + 'lt;';
    if (c === '>') return '&' + 'gt;';
    if (c === '"') return '&' + 'quot;';
    return '&#39;';
  });
}
function raw(s) { const o = new String(s); o.__raw = true; return o; }
function html(strings, ...vals) {
  return strings.reduce((acc, str, i) => {
    const v = vals[i];
    if (v == null || v === false) return acc + str;
    if (Array.isArray(v)) return acc + str + v.join('');
    if (v && v.__raw) return acc + str + String(v);
    return acc + str + esc(v);
  }, '');
}
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function round2(n) { return Math.round(num(n) * 100) / 100; }
function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }

function indianGroup(intStr) {
  const neg = intStr.startsWith('-');
  if (neg) intStr = intStr.slice(1);
  const last3 = intStr.slice(-3);
  const rest = intStr.slice(0, -3);
  const g = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + g;
}
function formatINR(n, opts) {
  opts = opts || {};
  if (state && state.privacy && !opts.force) return '••••••••';
  if (n == null || n === '' || Number.isNaN(Number(n))) return '—';
  const x = Number(n);
  const abs = Math.abs(x);
  if (opts.compact) {
    if (abs >= 1e7) return (x<0?'-':'') + '₹' + (abs/1e7).toFixed(2) + ' Cr';
    if (abs >= 1e5) return (x<0?'-':'') + '₹' + (abs/1e5).toFixed(2) + ' L';
  }
  const [i, d] = abs.toFixed(opts.ints ? 0 : 2).split('.');
  return (x<0?'-':'') + '₹' + indianGroup(i) + (opts.ints ? '' : '.' + d);
}
function formatNum(n, d) {
  if (state && state.privacy && arguments[2] === 'money') return '••••';
  if (n == null || n === '' || Number.isNaN(Number(n))) return '—';
  return Number(n).toLocaleString('en-IN', { maximumFractionDigits: d==null?2:d, minimumFractionDigits: 0 });
}
function formatPct(n) {
  if (n == null || Number.isNaN(Number(n))) return '—';
  const x = Number(n);
  return (x>=0?'+':'') + x.toFixed(1) + '%';
}
function formatDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (Number.isNaN(d.getTime())) return String(s).slice(0,10);
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function acresCentsFromTotal(cents) {
  cents = Math.round(num(cents));
  const neg = cents < 0; cents = Math.abs(cents);
  const ac = Math.floor(cents / CENTS_PER_ACRE);
  const c = cents % CENTS_PER_ACRE;
  return { acres: neg ? -ac : ac, cents: c, total: neg ? -cents : cents };
}
function totalCents(acres, cents) { return round2(num(acres) * CENTS_PER_ACRE + num(cents)); }
function formatArea(totalCentsVal) {
  if (totalCentsVal == null) return '—';
  const { acres, cents } = acresCentsFromTotal(totalCentsVal);
  const parts = [];
  if (acres) parts.push(acres + (Math.abs(acres)===1 ? ' acre' : ' acres'));
  if (cents || !parts.length) parts.push(cents + (cents===1 ? ' cent' : ' cents'));
  return parts.join(' ');
}

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fwm:' + text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ===================== IndexedDB ===================== */
function migrate(dbConn, tx, oldVersion) {
  for (const [name, opts, indexes] of STORES) {
    let store;
    if (dbConn.objectStoreNames.contains(name)) store = tx.objectStore(name);
    else store = dbConn.createObjectStore(name, opts);
    (indexes || []).forEach(([idx, key, extra]) => {
      if (!store.indexNames.contains(idx)) store.createIndex(idx, key, extra || {});
    });
  }
}
function openDb(name, version) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(name, version);
    req.onupgradeneeded = (e) => {
      migrate(req.result, req.transaction, e.oldVersion || 0);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('Database open blocked'));
  });
}
function txDone(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
}
function storeGetAll(store) {
  return new Promise((resolve, reject) => {
    const r = store.getAll();
    r.onsuccess = () => resolve(r.result || []);
    r.onerror = () => reject(r.error);
  });
}
function storeGet(store, key) {
  return new Promise((resolve, reject) => {
    const r = store.get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function loadAll() {
  const names = STORES.map(s => s[0]);
  const t = db.transaction(names, 'readonly');
  const out = {};
  for (const n of names) out[n] = await storeGetAll(t.objectStore(n));
  await txDone(t);
  const settings = {};
  for (const s of out.settings) settings[s.key] = s.value;
  const securities = {};
  for (const s of out.securities) securities[s.symbol] = s;
  const coconutTrees = {};
  for (const t of out.coconutTrees) coconutTrees[t.segmentId] = t;
  cache = {
    people: out.people.sort((a,b) => a.name.localeCompare(b.name)),
    securities,
    transactions: out.transactions.sort((a,b) => (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id)),
    holdingsMeta: out.holdingsMeta,
    watchlist: out.watchlist,
    theses: out.theses,
    reminders: out.reminders,
    properties: out.properties,
    ownership: out.ownership,
    segments: out.segments,
    coconutTrees,
    coconutHarvests: out.coconutHarvests,
    paddyHarvests: out.paddyHarvests,
    agriExpenses: out.agriExpenses,
    fishPonds: out.fishPonds,
    fishStocking: out.fishStocking,
    fishExpenses: out.fishExpenses,
    fishHarvests: out.fishHarvests,
    propertyHistory: out.propertyHistory,
    activity: out.activity.sort((a,b) => (b.at||'').localeCompare(a.at||'')),
    settings
  };
  return cache;
}
async function put(store, rec) {
  const t = db.transaction(store, 'readwrite');
  t.objectStore(store).put(rec);
  await txDone(t);
}
async function putMany(store, recs) {
  if (!recs.length) return;
  const t = db.transaction(store, 'readwrite');
  const s = t.objectStore(store);
  recs.forEach(r => s.put(r));
  await txDone(t);
}
async function del(store, id) {
  const t = db.transaction(store, 'readwrite');
  t.objectStore(store).delete(id);
  await txDone(t);
}
async function setSetting(key, value) {
  await put('settings', { key, value });
  if (cache) cache.settings[key] = value;
}
async function logActivity(action, relatedType, relatedId, description) {
  const rec = { id: uid(), at: nowIso(), action, relatedType: relatedType||'', relatedId: relatedId||'', description: description||'' };
  await put('activity', rec);
  if (cache) {
    cache.activity.unshift(rec);
    if (cache.activity.length > ACTIVITY_CAP) {
      const drop = cache.activity.pop();
      try { await del('activity', drop.id); } catch (e) {}
    }
  }
}

/* ===================== Domain: stocks ===================== */
function upsertSecurityFields(symbol, fields) {
  symbol = String(symbol||'').trim().toUpperCase();
  if (!symbol) return null;
  const prev = cache.securities[symbol] || { symbol };
  const next = Object.assign({}, prev, fields, { symbol });
  if (fields.company && !next.company) next.company = fields.company;
  cache.securities[symbol] = next;
  return next;
}
function computeHoldings(transactions) {
  const map = new Map();
  const sorted = transactions.slice().sort((a,b) => (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));
  for (const tx of sorted) {
    const symbol = String(tx.symbol||'').toUpperCase();
    const k = tx.personId + '|' + symbol;
    let h = map.get(k);
    if (!h) {
      h = { personId: tx.personId, symbol, company: tx.company||symbol, qty: 0, cost: 0, realized: 0, buys: 0, sells: 0, txCount: 0 };
      map.set(k, h);
    }
    if (tx.company) h.company = tx.company;
    h.txCount++;
    const q = num(tx.quantity);
    const px = num(tx.price);
    const ch = num(tx.charges);
    if (tx.type === 'BUY') {
      h.cost += q * px + ch;
      h.qty += q;
      h.buys += q;
    } else if (tx.type === 'SELL') {
      const avg = h.qty ? h.cost / h.qty : 0;
      const proceeds = q * px - ch;
      h.realized += proceeds - avg * q;
      h.cost -= avg * q;
      h.qty -= q;
      h.sells += q;
    }
  }
  const metaBy = {};
  for (const m of (cache.holdingsMeta||[])) metaBy[m.personSymbol] = m;
  const rows = [];
  for (const h of map.values()) {
    const sec = cache.securities[h.symbol] || {};
    const meta = metaBy[h.personId + '|' + h.symbol] || {};
    const avg = h.qty ? h.cost / h.qty : 0;
    const price = num(sec.currentPrice);
    const value = h.qty * price;
    const invested = h.cost;
    const upnl = value - invested;
    const upnlPct = invested ? (upnl / invested) * 100 : 0;
    rows.push({
      personId: h.personId,
      symbol: h.symbol,
      company: sec.company || h.company || h.symbol,
      exchange: sec.exchange || meta.exchange || '',
      sector: sec.sector || meta.sector || '',
      marketCapCategory: sec.marketCapCategory || meta.marketCapCategory || '',
      qty: h.qty,
      avgBuyPrice: avg,
      invested,
      currentPrice: price,
      value,
      upnl,
      upnlPct,
      realized: h.realized,
      notes: meta.notes || '',
      lastPriceUpdate: sec.updatedDate || '',
      txCount: h.txCount,
      buys: h.buys,
      sells: h.sells,
      metaId: meta.id
    });
  }
  return rows;
}
function remainingQty(personId, symbol, exceptTxId) {
  symbol = String(symbol||'').toUpperCase();
  let q = 0;
  for (const tx of cache.transactions) {
    if (exceptTxId && tx.id === exceptTxId) continue;
    if (tx.personId !== personId || String(tx.symbol).toUpperCase() !== symbol) continue;
    q += tx.type === 'BUY' ? num(tx.quantity) : -num(tx.quantity);
  }
  return q;
}

function allocShare(rec, personIds, isAll) {

  if (!al.length) return isAll ? 1 : 0;

  let s = 0;
  const set = new Set(personIds);
  for (const a of al) if (set.has(a.personId)) s += num(a.pct);

}

}

/* Coconut harvest math */
function coconutCalc(h) {
  const n = num(h.coconuts);
  const px = num(h.pricePerCoconut);
  const gross = n * px;
  const l1 = h.labor1Type === 'per_unit' ? num(h.labor1Value) * n : num(h.labor1Value);
  const l2 = h.labor2Type === 'per_unit' ? num(h.labor2Value) * n : num(h.labor2Value);
  const transport = num(h.transport);
  const other = num(h.other);
  const expenses = l1 + l2 + transport + other;
  return { n, px, gross, labor1: l1, labor2: l2, transport, other, expenses, net: gross - expenses };
}
function paddyCalc(h) {
  const q = num(h.quantity);
  const px = num(h.price);
  return { quantity: q, gross: q * px };
}
function toKg(q, unit) {
  q = num(q);
  return String(unit).toLowerCase().startsWith('ton') ? q * 1000 : q;
}
function fishHarvestCalc(h) {
  const kg = toKg(h.quantity, h.unit);
  const gross = kg * num(h.pricePerKg);
  const commission = num(h.commission);
  const transport = num(h.transport);
  const other = num(h.otherSelling);
  const selling = commission + transport + other;
  return { kg, gross, commission, transport, other, selling, netRevenue: gross - selling };
}
function pondCosts(pondId, year) {
  const inYear = (d) => !year || yearOf(d) === String(year);
  let stocking = 0, stockedFish = 0;
  for (const s of cache.fishStocking) {
    if (s.pondId !== pondId) continue;
    if (!inYear(s.date)) continue;
    stocking += num(s.numberIntroduced) * num(s.pricePerFish);
    stockedFish += num(s.numberIntroduced);
  }
  let opex = 0;
  const byCat = {};
  for (const e of cache.fishExpenses) {
    if (e.pondId !== pondId) continue;
    if (!inYear(e.date)) continue;
    opex += num(e.amount);
    byCat[e.category] = (byCat[e.category]||0) + num(e.amount);
  }
  return { stocking, opex, productionCost: stocking + opex, stockedFish, byCat };
}

/* Land current ownership: ownership table only. Intended recipient is NOT current ownership. */
function propertyValueShare(prop, personIds, isAll) {
  const owners = cache.ownership.filter(o => o.propertyId === prop.id);
  if (isAll) return { area: num(prop.totalCents), value: num(prop.currentValue), pct: 100 };
  const set = new Set(personIds);
  let pct = 0;
  for (const o of owners) if (set.has(o.personId)) pct += num(o.ownershipPct);
  const f = pct / 100;
  return { area: num(prop.totalCents) * f, value: num(prop.currentValue) * f, pct };
}

/* ===================== Filters ===================== */
function selectedPersonIds() {
  if (!state.peopleFilter || state.peopleFilter === 'ALL' || !state.peopleFilter.length) {
    return { ids: cache.people.map(p => p.id), isAll: true };
  }
  return { ids: state.peopleFilter.slice(), isAll: false };
}
function peopleMatch(id) {
  const { ids, isAll } = selectedPersonIds();
  return isAll || ids.includes(id);
}
function assetMatch(kind) {
  const a = state.assetType || 'all';
  if (a === 'all') return true;
  if (a === 'agriculture') return ['agriculture','coconut','paddy','fish'].includes(kind);
  return a === kind;
}
function filterHoldings(rows) {
  const { ids, isAll } = selectedPersonIds();
  const set = new Set(ids);
  return rows.filter(h => (isAll || set.has(h.personId)) && h.qty > 1e-9);
}
function consolidateHoldings(rows) {
  const map = new Map();
  let totalVal = 0;
  for (const r of rows) totalVal += r.value;
  for (const r of rows) {
    let g = map.get(r.symbol);
    if (!g) {
      g = Object.assign({}, r, { qty:0, invested:0, value:0, upnl:0, realized:0, people:[] });
      map.set(r.symbol, g);
    }
    g.qty += r.qty;
    g.invested += r.invested;
    g.value += r.value;
    g.upnl += r.upnl;
    g.realized += r.realized;
    g.people.push(r.personId);
    g.currentPrice = r.currentPrice;
    g.company = r.company;
    g.sector = r.sector || g.sector;
    g.marketCapCategory = r.marketCapCategory || g.marketCapCategory;
  }
  return [...map.values()].map(g => {
    g.avgBuyPrice = g.qty ? g.invested / g.qty : 0;
    g.upnlPct = g.invested ? (g.upnl / g.invested) * 100 : 0;
    g.weight = totalVal ? (g.value / totalVal) * 100 : 0;
    return g;
  });
}
function withWeights(rows) {
  const t = rows.reduce((s,r) => s + r.value, 0);
  return rows.map(r => Object.assign({}, r, { weight: t ? (r.value/t)*100 : 0 }));
}

function coconutRowsFiltered(year) {
  const { ids, isAll } = selectedPersonIds();
  return cache.coconutHarvests.filter(h => !year || yearOf(h.harvestDate)===String(year)).map(h => {
    const c = coconutCalc(h);
    const share = allocShare(h, ids, isAll);
    return Object.assign({ rec:h, share }, c, {
      gross: c.gross * share, expenses: c.expenses * share, net: c.net * share, n: c.n * share
    });
  }).filter(x => x.share > 0 || isAll);
}
function paddyRowsFiltered(year) {
  const { ids, isAll } = selectedPersonIds();
  return cache.paddyHarvests.filter(h => !year || yearOf(h.harvestDate)===String(year)).map(h => {
    const c = paddyCalc(h);
    const share = allocShare(h, ids, isAll);
    return { rec:h, share, quantity: c.quantity * share, gross: c.gross * share };
  }).filter(x => x.share > 0 || isAll);
}
function agriExpFiltered(year, crop) {
  const { ids, isAll } = selectedPersonIds();
  return cache.agriExpenses.filter(e => {
    if (year && yearOf(e.date) !== String(year)) return false;
    if (crop && e.crop && e.crop !== crop && crop !== 'All') return false;
    return true;
  }).map(e => {
    const share = allocShare(e, ids, isAll);
    return { rec:e, share, amount: num(e.amount) * share };
  }).filter(x => x.share > 0 || isAll);
}

function snapshotStats() {
  const { ids, isAll } = selectedPersonIds();
  const holdingsAll = withWeights(filterHoldings(computeHoldings(cache.transactions)));
  const holdings = state.viewMode === 'consolidated' ? consolidateHoldings(holdingsAll) : holdingsAll;
  const tx = cache.transactions.filter(t => isAll || ids.includes(t.personId));
  const realized = holdingsAll.reduce((s,h) => s + h.realized, 0);
  const invested = holdingsAll.reduce((s,h) => s + h.invested, 0);
  const value = holdingsAll.reduce((s,h) => s + h.value, 0);
  const upnl = value - invested;

  const landProps = cache.properties.filter(p => {
    const t = (p.propertyType||'').toLowerCase();
    return !t.includes('site');
  });
  const siteProps = cache.properties.filter(p => (p.propertyType||'').toLowerCase().includes('site'));
  function sumProps(list) {
    let area=0, val=0, n=0;
    for (const p of list) {
      const sh = propertyValueShare(p, ids, isAll);
      if (!isAll && sh.pct <= 0) continue;
      area += sh.area; val += sh.value; n++;
    }
    return { area, value: val, count: n };
  }
  const land = sumProps(landProps);
  const sites = sumProps(siteProps);

  const coco = coconutRowsFiltered();
  const padd = paddyRowsFiltered();
  const expAll = agriExpFiltered();
  const cocoExpHarvest = coco.reduce((s,x)=>s+x.expenses,0);
  const cocoGross = coco.reduce((s,x)=>s+x.gross,0);
  const paddGross = padd.reduce((s,x)=>s+x.gross,0);
  const agriExp = expAll.reduce((s,x)=>s+x.amount,0);
  const cocoTrees = cache.segments.filter(s => s.cropUse === 'Coconut').reduce((s,seg) => {
    const t = cache.coconutTrees[seg.id];
    return s + (t ? num(t.totalTrees) : 0);
  }, 0);
  const cocoArea = cache.segments.filter(s => s.cropUse === 'Coconut').reduce((s,seg) => s + num(seg.totalCents), 0);
  const paddArea = cache.segments.filter(s => s.cropUse === 'Paddy').reduce((s,seg) => s + num(seg.totalCents), 0);

  let fishGross=0, fishSell=0, fishCost=0, fishKg=0, fishStocked=0, fishOpex=0, fishStockCost=0;
  for (const pond of cache.fishPonds) {
    const share = allocShare(pond, ids, isAll);
    if (!isAll && share<=0) continue;
    const c = pondCosts(pond.id);
    fishCost += c.productionCost * share;
    fishStocked += c.stockedFish * share;
    fishOpex += c.opex * share;
    fishStockCost += c.stocking * share;
    for (const h of cache.fishHarvests.filter(x => x.pondId === pond.id)) {
      const fc = fishHarvestCalc(h);
      const hs = allocShare(h, ids, isAll);
      const f = isAll ? 1 : hs;
      fishGross += fc.gross * f;
      fishSell += fc.selling * f;
      fishKg += fc.kg * f;
    }
  }
  const fishNetRev = fishGross - fishSell;
  const fishProfit = fishNetRev - fishCost;

  const agriGross = cocoGross + paddGross + fishGross;
  const agriExpenses = cocoExpHarvest + agriExp + fishCost + fishSell;
  const agriNet = (cocoGross - cocoExpHarvest) + paddGross - agriExp + fishProfit;

  return {
    holdings, holdingsAll,
    stocks: {
      invested, value, upnl, upnlPct: invested ? upnl/invested*100 : 0, realized,
      totalPnL: upnl + realized, holdings: holdingsAll.length,
      companies: new Set(holdingsAll.map(h=>h.symbol)).size,
      transactions: tx.length, shares: holdingsAll.reduce((s,h)=>s+h.qty,0)
    },
    land, sites,
    coconut: {
      area: cocoArea, trees: cocoTrees, production: coco.reduce((s,x)=>s+x.n,0),
      gross: cocoGross, expenses: cocoExpHarvest, net: cocoGross - cocoExpHarvest,
      harvests: coco.length
    },
    paddy: {
      area: paddArea, production: padd.reduce((s,x)=>s+x.quantity,0),
      gross: paddGross, expenses: expAll.filter(e => e.rec.crop==='Paddy').reduce((s,x)=>s+x.amount,0),
      net: paddGross - expAll.filter(e => e.rec.crop==='Paddy').reduce((s,x)=>s+x.amount,0)
    },
    fish: {
      ponds: cache.fishPonds.length, stocked: fishStocked, production: fishKg,
      cost: fishCost, stockingCost: fishStockCost, opex: fishOpex,
      revenue: fishGross, selling: fishSell, netRevenue: fishNetRev, profit: fishProfit,
      costPerKg: fishKg ? fishCost/fishKg : 0, profitPerKg: fishKg ? fishProfit/fishKg : 0
    },
    agri: { gross: agriGross, expenses: agriExpenses, net: agriNet },
    overall: { stockValue: value, landValue: land.value, siteValue: sites.value }
  };
}

/* ===================== Charts ===================== */
const CHART_COLORS = ['#234e49','#8a6d4a','#2c4a6e','#6b3f46','#4d5c46','#5c4d6b','#3d5a4c','#7a5340','#445566','#6f675e'];
function donutSvg(parts, size) {
  size = size || 168;
  const total = parts.reduce((s,p)=>s+num(p.value),0) || 1;
  const cx=size/2, cy=size/2, r=size*0.34, sw=size*0.16;
  const c=2*Math.PI*r;
  let off=0;
  const rings = parts.map((p,i) => {
    const frac = num(p.value)/total;
    const dash = frac * c;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.color||CHART_COLORS[i%CHART_COLORS.length]}" stroke-width="${sw}" stroke-dasharray="${dash} ${c-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off += dash;
    return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}<circle cx="${cx}" cy="${cy}" r="${r-sw/2-2}" fill="var(--bg-elevated)"/></svg>`;
}
function legendHtml(parts) {
  const total = parts.reduce((s,p)=>s+num(p.value),0) || 1;
  return `<ul class="legend">${parts.map((p,i)=>`<li><span><span class="swatch" style="background:${p.color||CHART_COLORS[i%CHART_COLORS.length]}"></span>${esc(p.label)}</span><span class="tabular">${(num(p.value)/total*100).toFixed(1)}%</span></li>`).join('')}</ul>`;
}
function hbars(parts) {
  const max = Math.max(1, ...parts.map(p=>num(p.value)));
  return parts.map((p,i)=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:var(--text-sm)"><span>${esc(p.label)}</span><span class="tabular">${esc(p.right||'')}</span></div><div class="bar"><span style="width:${num(p.value)/max*100}%;background:${p.color||CHART_COLORS[i%CHART_COLORS.length]}"></span></div></div>`).join('');
}

function field(name, label, type, val, extra) {
  extra = extra || {};
  const id = 'f_' + name;
  let ctrl;
  if (type === 'textarea') ctrl = `<textarea id="${id}" name="${name}" rows="${extra.rows||3}">${esc(val||'')}</textarea>`;
  else if (type === 'select') {
    const opts = (extra.options||[]).map(o => {
      const v = typeof o === 'string' ? o : o.value;
      const l = typeof o === 'string' ? o : o.label;
      return `<option value="${esc(v)}" ${String(v)===String(val||'')?'selected':''}>${esc(l)}</option>`;
    }).join('');
    ctrl = `<select id="${id}" name="${name}">${extra.placeholder?`<option value="">${esc(extra.placeholder)}</option>`:''}${opts}</select>`;
  } else {
    ctrl = `<input id="${id}" name="${name}" type="${type}" value="${esc(val==null?'':val)}" ${extra.step?`step="${extra.step}"`:''} ${extra.min!=null?`min="${extra.min}"`:''} ${extra.inputmode?`inputmode="${extra.inputmode}"`:''} ${extra.placeholder?`placeholder="${esc(extra.placeholder)}"`:''}/>`;
  }
  return `<div class="field ${extra.full?'full':''}"><label for="${id}">${esc(label)}</label>${ctrl}${extra.help?`<div class="help">${esc(extra.help)}</div>`:''}</div>`;
}
function peopleOptions(selected) {
  return cache.people.map(p => `<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');
}
function propertyOptions(selected) {
  return cache.properties.map(p => `<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');
}
function segmentOptions(propertyId, selected, crop) {
  return cache.segments.filter(s => (!propertyId || s.propertyId===propertyId) && (!crop || s.cropUse===crop))
    .map(s => `<option value="${s.id}" ${s.id===selected?'selected':''}>${esc(propertyName(s.propertyId)+' · '+(s.name||s.cropUse))}</option>`).join('');
}
function pondOptions(selected) {
  return cache.fishPonds.map(p => `<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');
}
function tableHtml(cols, rows, rowId) {
  if (!rows.length) return '';
  const head = cols.map(c => `<th class="${c.num?'num':''}">${esc(c.label)}</th>`).join('') + '<th></th>';
  const body = rows.map(r => {
    const tds = cols.map(c => {
      let v = typeof c.value === 'function' ? c.value(r) : r[c.key];
      if (v && v.__raw) v = String(v); else v = esc(v==null?'':v);
      return `<td data-label="${esc(c.label)}" class="${c.num?'num tabular':''} ${c.cls?c.cls(r):''}">${v}</td>`;
    }).join('');
    const id = rowId ? rowId(r) : '';
    return `<tr data-id="${esc(id)}">${tds}<td data-label="Actions" class="row-actions">${r._actions||''}</td></tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function actionsFor(id, acts) {
  return acts.map(a => `<button type="button" class="icon-btn" data-act="${a.act}" data-id="${esc(id)}" title="${esc(a.title)}">${icon(a.icon,16)}</button>`).join('');
}

function closeModal() { const m = $('#modal-root'); m.hidden = true; m.innerHTML = ''; }
function openModal(title, sub, bodyHtml, footerHtml) {
  const m = $('#modal-root');
  m.hidden = false;
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:''}${bodyHtml}<div class="modal-actions">${footerHtml||''}</div></div>`;
  m.onclick = (e) => { if (e.target === m) closeModal(); };
}
function confirmDlg(title, message, onYes, danger) {
  openModal(title, message, '', `${btn('Cancel',{act:'close-modal'})}${btn('Confirm',{cls: danger?'danger':'primary', act:'confirm-ok'})}`);
  $('#modal-root').querySelector('[data-act="confirm-ok"]').onclick = async () => { closeModal(); await onYes(); };

function formFromFields(fields, values) {
  values = values || {};
  return `<form id="edit-form" class="form-grid" autocomplete="off">${fields.map(f => {
    let val = values[f.name];
    if (val == null) val = f.value || '';
    if (f.type === 'allocations') return `<div class="field full" id="alloc-wrap"><label>Person allocation</label><div id="alloc-rows"></div><button type="button" class="btn sm" id="alloc-add">${icon('plus',14)} Add person</button><div class="help" id="alloc-total"></div></div>`;
    if (f.type === 'area') {
      const ac = acresCentsFromTotal(val || values.totalCents || 0);
      return `<div class="field ${f.full?'full':''}"><label>${esc(f.label)}</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <input name="acres" type="number" min="0" step="1" value="${ac.acres}" placeholder="Acres"/>
        <input name="cents" type="number" min="0" step="0.01" value="${ac.cents}" placeholder="Cents"/>
      </div><div class="help">1 acre = 100 cents. Preview updates on save.</div></div>`;
    }
    return field(f.name, f.label, f.type||'text', val, f);
  }).join('')}<div class="full error-text" id="form-err" hidden></div></form>`;
}
function readForm(form) {
  const fd = new FormData(form);
  const o = {};
  for (const [k,v] of fd.entries()) o[k] = v;
  return o;
}
function renderAllocRows(al) {
  al = al || [];
  if (!al.length) {
    $('#alloc-rows').innerHTML = '';
    updateAllocTotal();
    return;
  }
  $('#alloc-rows').innerHTML = al.map((a,i) => `<div class="alloc-row">
    <select name="alloc_person_${i}">${peopleOptions(a.personId)}</select>
    <input name="alloc_pct_${i}" type="number" min="0" max="100" step="0.01" value="${esc(a.pct)}"/>
    <button type="button" class="icon-btn alloc-del" data-i="${i}">${icon('x',14)}</button>
  </div>`).join('');
  updateAllocTotal();
}
function gatherAlloc(form) {
  const al = [];
  const n = form.querySelectorAll('[name^="alloc_person_"]').length;
  for (let i=0;i<99;i++) {
    const p = form['alloc_person_'+i]; const pct = form['alloc_pct_'+i];
    if (!p) break;
    if (p.value) al.push({ personId: p.value, pct: num(pct.value) });
  }
  return al;
}
function updateAllocTotal() {
  const form = $('#edit-form'); if (!form || !$('#alloc-total')) return;
  const t = gatherAlloc(form).reduce((s,a)=>s+num(a.pct),0);
  const el = $('#alloc-total');
  el.textContent = 'Total ' + round2(t) + '% — should equal 100%.';
  el.style.color = Math.abs(t-100)<0.051 ? 'var(--profit)' : (t>100 ? 'var(--loss)' : 'var(--warn)');
}

async function openFormModal(opts) {
  const values = opts.values || {};
  openModal(opts.title, opts.sub||'', formFromFields(opts.fields, values), `${btn('Cancel',{act:'close-modal'})}${btn(opts.saveLabel||'Save',{cls:'primary',act:'form-save'})}`);
  if ($('#alloc-rows')) {
    renderAllocRows(values.allocations);
    $('#alloc-add').onclick = () => {
      const form = $('#edit-form');
      const al = gatherAlloc(form); al.push({ personId:'', pct:0 }); renderAllocRows(al);
    };
    $('#alloc-rows').addEventListener('input', updateAllocTotal);
    $('#alloc-rows').addEventListener('click', (e) => {
      const b = e.target.closest('.alloc-del'); if (!b) return;
      const al = gatherAlloc($('#edit-form')); al.splice(+b.dataset.i,1); renderAllocRows(al);
    });
  }
  if (opts.live) opts.live($('#edit-form'));
  $('#modal-root').querySelector('[data-act="form-save"]').onclick = async () => {
    const form = $('#edit-form');
    const data = readForm(form);
    if ($('#alloc-rows')) data.allocations = gatherAlloc(form);
    if (form.acres && form.cents) data.totalCents = totalCents(form.acres.value, form.cents.value);
    try {
      if (opts.validate) {
        const err = opts.validate(data);
        if (err) { const e=$('#form-err'); e.hidden=false; e.textContent=err; return; }
      }
      await opts.onSave(data);
      closeModal();
      await refresh();
    } catch (err) {
      const e=$('#form-err'); e.hidden=false; e.textContent = err.message || String(err);
    }
  };
}

/* PAGES */
function show(kind) {
  const a = state.assetType || 'all';
  if (a === 'all') return true;
  if (kind === 'stocks') return a === 'stocks';
  if (kind === 'land') return a === 'land' || a === 'sites' || a === 'agriculture' || a === 'coconut' || a === 'paddy';
  if (kind === 'sites') return a === 'sites';
  if (kind === 'agri') return ['agriculture','coconut','paddy','fish'].includes(a);
  if (kind === 'coconut') return a === 'agriculture' || a === 'coconut';
  if (kind === 'paddy') return a === 'agriculture' || a === 'paddy';
  if (kind === 'fish') return a === 'agriculture' || a === 'fish';
  return true;
}

function concentration(rows) {
  const sorted = rows.slice().sort((a,b)=>b.value-a.value);
  const total = sorted.reduce((s,r)=>s+r.value,0) || 1;
  const topn = (n) => sorted.slice(0,n).reduce((s,r)=>s+r.value,0)/total*100;
  return { sorted, total, top1: topn(1), top5: topn(5), top10: topn(10) };
}
function groupSum(rows, key) {
  const m = new Map();
  for (const r of rows) {
    const k = r[key] || 'Unknown';
    m.set(k, (m.get(k)||0)+r.value);
  }
  return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));
}

function yearSelect(id) {
  const years = new Set();
  for (const x of cache.coconutHarvests) years.add(yearOf(x.harvestDate));
  for (const x of cache.paddyHarvests) years.add(yearOf(x.harvestDate));
  for (const x of cache.fishHarvests) years.add(yearOf(x.harvestDate));
  for (const x of cache.agriExpenses) years.add(yearOf(x.date));
  const y = state.yearFilter || '';
  const opts = ['<option value="">All years</option>'].concat([...years].filter(Boolean).sort().reverse().map(yr=>`<option ${yr===y?'selected':''}>${yr}</option>`));
  return `<select id="${id}" data-act="year-filter" class="btn sm">${opts.join('')}</select>`;
}

function producingTrees(t) {
  if (!t) return 0;
  return Math.max(0, num(t.totalTrees) - num(t.youngTrees) - num(t.nonProducingTrees));
}
function renderCoconut() {
  const segs = cache.segments.filter(s => s.cropUse==='Coconut');
  const treeCards = segs.map(s => {
    const t = cache.coconutTrees[s.id] || { totalTrees:0, youngTrees:0, matureTrees:0, nonProducingTrees:0 };
    const prod = producingTrees(t);
    const perAcre = num(s.totalCents) ? (num(t.totalTrees) / (num(s.totalCents)/100)) : 0;
    return `<article class="card"><h3>${esc(propertyName(s.propertyId))} · ${esc(s.name||'Coconut')}</h3>
      <div class="stat-line"><span>Area</span><span>${formatArea(s.totalCents)}</span></div>
      <div class="stat-line"><span>Total trees</span><span>${formatNum(t.totalTrees,0)}</span></div>
      <div class="stat-line"><span>Young</span><span>${formatNum(t.youngTrees,0)}</span></div>
      <div class="stat-line"><span>Mature</span><span>${formatNum(t.matureTrees,0)}</span></div>
      <div class="stat-line"><span>Non-producing</span><span>${formatNum(t.nonProducingTrees,0)}</span></div>
      <div class="stat-line"><span>Producing (calc.)</span><span>${formatNum(prod,0)}</span></div>
      <div class="stat-line"><span>Trees / acre</span><span>${perAcre?perAcre.toFixed(1):'—'}</span></div>
      <button class="btn sm" data-act="edit-trees" data-id="${s.id}">Edit trees</button>
    </article>`;
  }).join('');
  const harvests = coconutRowsFiltered(state.yearFilter);
  harvests.forEach(h => {
    h._actions = actionsFor(h.rec.id, [{act:'edit-coco',icon:'edit',title:'Edit'},{act:'del-coco',icon:'trash',title:'Delete'}]);
  });
  const cols = [
    {label:'Date', value:h=>formatDate(h.rec.harvestDate)},
    {label:'Property', value:h=>propertyName(h.rec.propertyId)},
    {label:'Coconuts', num:true, value:h=>formatNum(h.n,0)},
    {label:'Price', num:true, value:h=>formatINR(h.px)},
    {label:'Gross', num:true, value:h=>formatINR(h.gross)},
    {label:'Expenses', num:true, value:h=>formatINR(h.expenses)},
    {label:'Net', num:true, cls:h=>pnlClass(h.net), value:h=>formatINR(h.net)}
  ];
  const byYear = {};
  for (const h of harvests) {
    const y = yearOf(h.rec.harvestDate) || '—';
    byYear[y] = byYear[y] || { n:0, gross:0, exp:0, net:0, c:0, pxn:0 };
    byYear[y].n += h.n; byYear[y].gross += h.gross; byYear[y].exp += h.expenses; byYear[y].net += h.net; byYear[y].c++; byYear[y].pxn += h.px * (h.n?1:0);
  }
  const annual = Object.entries(byYear).sort().reverse();
  const tot = harvests.reduce((a,h)=>({n:a.n+h.n,g:a.g+h.gross,e:a.e+h.expenses,net:a.net+h.net,c:a.c+1}),{n:0,g:0,e:0,net:0,c:0});
  return pageHead('Coconut', 'Harvests are periodic. Labor can be per nut or a lump sum. Person allocation is applied only in statistics.',
    yearSelect('y-coco') + btn('Add harvest',{act:'add-coco',cls:'primary',icon:'plus'}))
    + `<div class="kpi-grid">${kpiCard('Harvests', String(tot.c))}${kpiCard('Coconuts', formatNum(tot.n,0))}${kpiCard('Gross', formatINR(tot.g))}${kpiCard('Net', formatINR(tot.net))}</div>`
    + `<div class="kpi-grid" style="margin-top:12px">${treeCards||''}</div>`
    + `<h3 style="margin:18px 0 8px">Per harvest</h3>`
    + (harvests.length?tableHtml(cols,harvests,h=>h.rec.id):emptyState('No harvests','Record a picking with nuts, price and labor.','add-coco','Add harvest'))
    + `<div class="card" style="margin-top:12px"><h3>Annual</h3>${annual.map(([y,v]) => '<div class="stat-line"><span>'+esc(y)+' · '+v.c+' harvests · avg price '+formatINR(v.n ? v.gross/v.n : 0)+'</span><span class="maskable">'+formatNum(v.n,0)+' nuts · net '+formatINR(v.net)+'</span></div>').join('')||'<p class="muted">No annual data.</p>'}</div>`;
}

function renderFish() {
  const { ids, isAll } = selectedPersonIds();
  const ponds = cache.fishPonds.filter(p => isAll || allocShare(p, ids, false)>0);
  const cards = ponds.map(p => {
    const c = pondCosts(p.id, state.yearFilter);
    const harvests = cache.fishHarvests.filter(h => h.pondId===p.id && (!state.yearFilter || yearOf(h.harvestDate)===state.yearFilter));
    let kg=0, gross=0, sell=0;
    for (const h of harvests) { const f=fishHarvestCalc(h); kg+=f.kg; gross+=f.gross; sell+=f.selling; }
    const share = allocShare(p, ids, isAll);
    const netRev = gross - sell;
    const profit = netRev - c.productionCost;
    return `<article class="card">
      <h3>${esc(p.name)}</h3>
      <p class="hint">${esc(p.location||'')} · ${esc(p.size||'')} · ${esc(p.status||'')}</p>
      <div class="stat-line"><span>Stocked</span><span>${formatNum(c.stockedFish,0)}</span></div>
      <div class="stat-line"><span>Production</span><span>${formatNum(kg,1)} kg</span></div>
      <div class="stat-line"><span>Production cost</span><span class="maskable">${formatINR(c.productionCost * share)}</span></div>
      <div class="stat-line"><span>Cost / kg</span><span class="maskable">${kg?formatINR(c.productionCost/kg):'—'}</span></div>
      <div class="stat-line"><span>Gross revenue</span><span class="maskable">${formatINR(gross * (isAll?1:share))}</span></div>
      <div class="stat-line"><span>Selling expenses</span><span class="maskable">${formatINR(sell)}</span></div>
      <div class="stat-line"><span>Net revenue</span><span class="maskable">${formatINR(netRev)}</span></div>
      <div class="stat-line"><span>Net profit</span><span class="maskable ${pnlClass(profit)}">${formatINR(profit)}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">

      </div>
    </article>`;
  }).join('');
  return pageHead('Fish ponds', 'Stocking + monthly operating cost = production cost. Net profit = net revenue − production cost.',
    yearSelect('y-fish') + btn('Add pond',{act:'add-pond',cls:'primary',icon:'plus'}))
    + (cards || emptyState('No ponds','Add a pond, then stocking, monthly feed and harvests.','add-pond','Add pond'));
}

function renderRisk() {
  const s = snapshotStats();
  const stockVal = s.stocks.value;
  const landVal = s.land.value + s.sites.value;
  const agriNet = s.agri.net;
  const wealth = stockVal + landVal;
  const mix = [
    { label:'Stocks', value: stockVal },
    { label:'Land & sites', value: landVal }
  ];
  const cons = consolidateHoldings(filterHoldings(computeHoldings(cache.transactions)));
  const c = concentration(cons);
  const bySector = groupSum(cons,'sector');
  const topSec = bySector[0];
  return pageHead('Exposure', 'These are concentration statistics — not a credit score, VaR, or formal risk rating.')
    + `<div class="split">

async function lockApp() {
  if (!cache.settings.pinHash) { toast('Set a PIN in Settings first'); go('settings'); return; }
  state.locked = true;
  await setSetting('locked', true);
  showLock();
}
function showLock() {
  $('#app').hidden = true;
  const ls = $('#lock-screen'); ls.hidden = false;
  const wrap = $('#lock-pin'); wrap.innerHTML = '';
  for (let i=0;i<6;i++) {
    const inp = document.createElement('input');
    inp.type = 'password'; inp.inputMode = 'numeric'; inp.maxLength = 1; inp.dataset.i = i;
    inp.addEventListener('input', onPinInput);
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !inp.value && i) wrap.children[i-1].focus();
    });
    wrap.appendChild(inp);
  }
  wrap.children[0].focus();
  $('#lock-err').hidden = true;
}
async function onPinInput(e) {
  const wrap = $('#lock-pin');
  const i = +e.target.dataset.i;
  if (e.target.value && wrap.children[i+1]) wrap.children[i+1].focus();
  const pin = Array.from(wrap.children).map(x => x.value).join('');
  if (pin.length < 4) return;
  const hash = await sha256(pin);
  if (hash === cache.settings.pinHash) {
    state.locked = false;
    await setSetting('locked', false);
    $('#lock-screen').hidden = true;
    $('#app').hidden = false;
    await refresh();
  } else if (pin.length >= (cache.settings.pinLen || 4) && !Array.from(wrap.children).some(x=>!x.value)) {
    $('#lock-err').hidden = false;
    Array.from(wrap.children).forEach(x => x.value='');
    wrap.children[0].focus();
  }
}

async function replaySymbol(personId, symbol) {
  symbol = String(symbol||'').toUpperCase();
  const txs = cache.transactions.filter(t => t.personId===personId && String(t.symbol).toUpperCase()===symbol)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.id.localeCompare(b.id));
  let qty=0, cost=0;
  for (const tx of txs) {
    const q=num(tx.quantity), px=num(tx.price), ch=num(tx.charges);
    if (tx.type==='BUY') { cost += q*px+ch; qty += q; if (tx.realizedPnL) { tx.realizedPnL=0; await put('transactions', tx); } }
    else {
      const avg = qty? cost/qty : 0;
      const realized = q*px - ch - avg*q;
      cost -= avg*q; qty -= q;
      if (round2(tx.realizedPnL) !== round2(realized)) { tx.realizedPnL = realized; await put('transactions', tx); }
    }
  }
}
async function saveTx(data, existing) {
  if (!needPeople()) throw new Error('Add a person first');
  const personId = data.personId;
  const symbol = String(data.symbol||'').trim().toUpperCase();
  const type = data.type === 'SELL' ? 'SELL' : 'BUY';
  const quantity = num(data.quantity);
  const price = num(data.price);
  if (!personId) throw new Error('Choose a person');
  if (!String(data.company||'').trim() && !symbol) throw new Error('Company or symbol required');
  if (!symbol) throw new Error('Symbol required');
  if (quantity <= 0) throw new Error('Quantity must be positive');
  if (price < 0) throw new Error('Price cannot be negative');
  if (num(data.charges) < 0) throw new Error('Charges cannot be negative');
  const rem = remainingQty(personId, symbol, existing && existing.id);
  if (type === 'SELL' && quantity - rem > 1e-8) throw new Error('Cannot sell '+quantity+'. '+personName(personId)+' holds '+rem+' of '+symbol+'.');
  const rec = {
    id: existing?.id || uid(), personId, company: String(data.company||'').trim() || (cache.securities[symbol]||{}).company || symbol,
    symbol, type, date: data.date || today(), quantity, price, charges: num(data.charges), notes: data.notes||'',
    realizedPnL: 0, createdAt: existing?.createdAt || nowIso()
  };
  await put('transactions', rec);
  const prev = cache.transactions.findIndex(t => t.id===rec.id);
  if (prev>=0) cache.transactions[prev]=rec; else cache.transactions.push(rec);
  await replaySymbol(personId, symbol);
  const sec = upsertSecurityFields(symbol, {
    company: rec.company,
    exchange: data.exchange || undefined,
    sector: data.sector || undefined,
    marketCapCategory: data.marketCapCategory || undefined,
    currentPrice: data.currentPrice !== '' && data.currentPrice != null ? num(data.currentPrice) : undefined,
    updatedDate: data.currentPrice ? today() : undefined
  });
  if (sec) await put('securities', sec);
  await logActivity(type==='BUY'?'stock_bought':'stock_sold','transaction', rec.id, type+' '+quantity+' '+symbol+' · '+personName(personId));
}

async function saveProperty(data, existing) {

    location: data.location||'', village: data.village||'', mandal: data.mandal||'', district: data.district||'', state: data.state||'',

    createdAt: existing?.createdAt || nowIso(), updatedAt: nowIso()
  };
  await put('properties', rec);

    const al = data.allocations.filter(a => a.personId);

    await putMany('ownership', al.map(a => ({ id: uid(), propertyId: rec.id, personId: a.personId, ownershipPct: num(a.pct) })));

async function saveSegment(data, existing) {

  if (totalCentsVal <= 0) throw new Error('Segment area must be positive');
  const others = cache.segments.filter(s => s.propertyId===data.propertyId && (!existing || s.id!==existing.id));
  const used = others.reduce((s,x)=>s+num(x.totalCents),0);
  if (used + totalCentsVal - num(prop.totalCents) > 0.05) throw new Error('Segments would total '+formatArea(used+totalCentsVal)+', more than property '+formatArea(prop.totalCents));
  const rec = {
    id: existing?.id || uid(), propertyId: data.propertyId, name: data.name||data.cropUse||'Segment',
    cropUse: data.cropUse||'Other', totalCents: totalCentsVal, allocations: data.allocations||[], notes: data.notes||''

}

async function saveFishHarvest(data, existing) {
  const pondId = data.pondId || actId();
  if (!pondId) throw new Error('Choose a pond');
  if (num(data.quantity) <= 0) throw new Error('Quantity must be positive');
  harvestAllocCheck(data);
  const rec = {
    id: existing?.id || uid(), pondId, harvestDate: data.harvestDate||today(), fishType: data.fishType||'',
    quantity: num(data.quantity), unit: data.unit||'kg', pricePerKg: num(data.pricePerKg),
    commission: num(data.commission), transport: num(data.transport), otherSelling: num(data.otherSelling),
    allocations: data.allocations||[], notes: data.notes||''
  };
  await put('fishHarvests', rec);
  await logActivity('fish_harvested','fishHarvest', rec.id, rec.quantity+' '+rec.unit);
}

function bindCocoLive(form) {

  };

      cocoAnnMap[k].n+=c.n*sh; cocoAnnMap[k].g+=c.gross*sh; cocoAnnMap[k].e+=c.expenses*sh; cocoAnnMap[k].net+=c.net*sh; cocoAnnMap[k].c++;
    }
  }
  const cocoAnn = { headers: ['Year','Property','Person','Total Coconuts','Gross Income','Total Expenses','Net Income','Average Price','Number of Harvests'],
    rows: Object.values(cocoAnnMap).map(x => ({ Year:x.Year, Property:x.Property, Person:x.Person, 'Total Coconuts':round2(x.n), 'Gross Income':round2(x.g), 'Total Expenses':round2(x.e), 'Net Income':round2(x.net), 'Average Price': x.n?round2(x.g/x.n):0, 'Number of Harvests':x.c })) };
  const paddH = { headers: ['Property','Segment','Harvest Date','Person','Allocation %','Quantity','Unit','Price','Gross Income','Notes'],
    rows: cache.paddyHarvests.flatMap(h => { const c=paddyCalc(h); return expandAllocRows({ Property:propertyName(h.propertyId), Segment:segmentName(h.segmentId), 'Harvest Date':h.harvestDate, Quantity:c.quantity, Unit:h.unit, Price:num(h.price), 'Gross Income':c.gross, Notes:h.notes }, h.allocations); }) };
  const paddAnnMap = {};
  for (const h of cache.paddyHarvests) {
    const c=paddyCalc(h); const y=yearOf(h.harvestDate); const al=h.allocations&&h.allocations.length?h.allocations:[{personId:'',pct:100}];
    for (const a of al) {

      paddAnnMap[k]=paddAnnMap[k]||{ Year:y, Property:propertyName(h.propertyId), Person:a.personId?personName(a.personId):'', q:0,g:0 };
      paddAnnMap[k].q+=c.quantity*sh; paddAnnMap[k].g+=c.gross*sh;
    }

  const paddAnn = { headers: ['Year','Property','Person','Production','Gross Income','Expenses','Net Income'],
    rows: Object.values(paddAnnMap).map(x => ({ Year:x.Year, Property:x.Property, Person:x.Person, Production:round2(x.q), 'Gross Income':round2(x.g), Expenses:0, 'Net Income':round2(x.g) })) };
  const ponds = { headers: ['Pond','Property','Location','Size','Person','Allocation %','Status','Notes'],
    rows: cache.fishPonds.flatMap(p => expandAllocRows({ Pond:p.name, Property:propertyName(p.propertyId), Location:p.location, Size:p.size, Status:p.status, Notes:p.notes }, p.allocations)) };
  const stocking = { headers: ['Pond','Date','Fish Type','Number Introduced','Price Per Fish','Total Stocking Cost','Supplier','Person','Allocation %','Notes'],
    rows: cache.fishStocking.flatMap(s => expandAllocRows({ Pond:pondName(s.pondId), Date:s.date, 'Fish Type':s.fishType, 'Number Introduced':num(s.numberIntroduced), 'Price Per Fish':num(s.pricePerFish), 'Total Stocking Cost':num(s.numberIntroduced)*num(s.pricePerFish), Supplier:s.supplier, Notes:s.notes }, s.allocations)) };
  const fexp = { headers: ['Pond','Date','Month','Category','Amount','Person','Allocation %','Notes'],
    rows: cache.fishExpenses.flatMap(e => expandAllocRows({ Pond:pondName(e.pondId), Date:e.date, Month: String(e.date||'').slice(0,7), Category:e.category, Amount:num(e.amount), Notes:e.notes }, e.allocations)) };
  const fhar = { headers: ['Pond','Harvest Date','Fish Type','Quantity','Unit','Price Per Kg','Gross Revenue','Commission','Transport','Other Selling Expenses','Total Selling Expenses','Net Revenue','Production Cost','Cost Per Kg','Net Profit','Person','Allocation %','Notes'],
    rows: cache.fishHarvests.flatMap(h => {
      const f=fishHarvestCalc(h); const pc=pondCosts(h.pondId); const allH=cache.fishHarvests.filter(x=>x.pondId===h.pondId);
      const totKg=allH.reduce((s,x)=>s+fishHarvestCalc(x).kg,0)||1;
      const prod=pc.productionCost*(f.kg/totKg);
      return expandAllocRows({ Pond:pondName(h.pondId), 'Harvest Date':h.harvestDate, 'Fish Type':h.fishType, Quantity:num(h.quantity), Unit:h.unit, 'Price Per Kg':num(h.pricePerKg), 'Gross Revenue':f.gross, Commission:f.commission, Transport:f.transport, 'Other Selling Expenses':f.other, 'Total Selling Expenses':f.selling, 'Net Revenue':f.netRevenue, 'Production Cost':round2(prod), 'Cost Per Kg': f.kg?round2(prod/f.kg):0, 'Net Profit': round2(f.netRevenue-prod), Notes:h.notes }, h.allocations);
    }) };
  const s = snapshotStats();
  const summary = { headers: ['Metric','Value'], rows: [
    { Metric:'Total stock value', Value: round2(s.stocks.value) },
    { Metric:'Total stock invested', Value: round2(s.stocks.invested) },
    { Metric:'Stock unrealized P&L', Value: round2(s.stocks.upnl) },
    { Metric:'Stock realized P&L', Value: round2(s.stocks.realized) },
    { Metric:'Total land value', Value: round2(s.land.value) },
    { Metric:'Total site value', Value: round2(s.sites.value) },
    { Metric:'Total agricultural gross income', Value: round2(s.agri.gross) },
    { Metric:'Total agricultural expenses', Value: round2(s.agri.expenses) },
    { Metric:'Total net agricultural income', Value: round2(s.agri.net) },
    { Metric:'Fish production cost', Value: round2(s.fish.cost) },
    { Metric:'Fish gross revenue', Value: round2(s.fish.revenue) },
    { Metric:'Fish net profit', Value: round2(s.fish.profit) }
  ]};
  const agriE = { headers: ['Date','Property','Segment','Crop','Category','Amount','Person','Allocation %','Notes'],
    rows: cache.agriExpenses.flatMap(e => expandAllocRows({ Date:e.date, Property:propertyName(e.propertyId), Segment:segmentName(e.segmentId), Crop:e.crop, Category:e.category, Amount:num(e.amount), Notes:e.notes }, e.allocations)) };
  const fishAnnRows = [];
  for (const pond of cache.fishPonds) {
    const years = new Set();
    for (const h of cache.fishHarvests.filter(x=>x.pondId===pond.id)) years.add(yearOf(h.harvestDate));
    for (const st of cache.fishStocking.filter(x=>x.pondId===pond.id)) years.add(yearOf(st.date));
    for (const e of cache.fishExpenses.filter(x=>x.pondId===pond.id)) years.add(yearOf(e.date));
    const al = pond.allocations && pond.allocations.length ? pond.allocations : [{ personId:'', pct:100 }];
    for (const y of [...years].filter(Boolean).sort()) {
      const c = pondCosts(pond.id, y);
      let kg=0, gross=0, sell=0;
      for (const h of cache.fishHarvests.filter(x=>x.pondId===pond.id && yearOf(x.harvestDate)===y)) {
        const f = fishHarvestCalc(h); kg+=f.kg; gross+=f.gross; sell+=f.selling;
      }
      for (const a of al) {
        const sh = (num(a.pct)||100)/100;
        fishAnnRows.push({
          Year:y, Pond:pond.name, Person: a.personId?personName(a.personId):'',
          'Fish Stocked': round2(c.stockedFish*sh), Production: round2(kg*sh),
          'Production Cost': round2(c.productionCost*sh), 'Gross Revenue': round2(gross*sh),
          'Selling Expenses': round2(sell*sh), 'Net Revenue': round2((gross-sell)*sh),
          'Net Profit': round2((gross-sell-c.productionCost)*sh),
          'Cost Per Kg': kg ? round2(c.productionCost/kg) : 0
        });
      }
    }
  }
  const fishAnn = { headers: ['Year','Pond','Person','Fish Stocked','Production','Production Cost','Gross Revenue','Selling Expenses','Net Revenue','Net Profit','Cost Per Kg'], rows: fishAnnRows };
  return {
    'Summary': summary,
    'Stock Holdings': stockHoldings,
    'Stock Transactions': stockTx,
    'Watchlist': watch,
    'Stock Reminders': rem,
    'Properties': props,
    'Property Ownership': own,
    'Land Segments': segs,
    'Property History': hist,
    'Coconut Trees': trees,
    'Coconut Harvests': cocoH,
    'Coconut Annual Summary': cocoAnn,
    'Paddy Harvests': paddH,
    'Paddy Annual Summary': paddAnn,
    'Fish Ponds': ponds,
    'Fish Stocking': stocking,
    'Fish Monthly Expenses': fexp,
    'Fish Harvests': fhar,

    'Agricultural Expenses': agriE
  };
}
