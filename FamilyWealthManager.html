function csvEsc(v) { const s=String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function parseCsv(text) {
  const rows=[]; let row=[], cur='', q=false;
  const push=()=>{ row.push(cur); cur=''; };
  for (let i=0;i<text.length;i++) {
    const ch=text[i];
    if (q) { if (ch==='"' && text[i+1]==='"') { cur+='"'; i++; } else if (ch==='"') q=false; else cur+=ch; }
    else {
      if (ch==='"') q=true;
      else if (ch===',' ) push();
      else if (ch==='\n') { push(); if (row.some(c=>c!=='')) rows.push(row); row=[]; }
      else if (ch!=='\r') cur+=ch;
    }
  }
  if (cur!=='' || row.length) { push(); rows.push(row); }
  if (!rows.length) return { headers:[], rows:[] };
  const headers = rows[0].map(h => String(h||'').trim());
  const out = rows.slice(1).map(r => {
    const o={}; headers.forEach((h,i)=>o[h]=r[i]==null?'':r[i]); return o;
  });
  return { headers, rows: out };
}
function normKey(k) { return String(k||'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[%]/g,'').replace(/[_/]+/g,' ').replace(/\s+/g,' '); }
function rowGet(row, ...names) {
  const map = {};
  for (const [k,v] of Object.entries(row)) map[normKey(k)] = v;
  for (const n of names) { const v = map[normKey(n)]; if (v!=null && v!=='') return v; }
  return '';
}
function findPersonByName(name) {
  if (!name) return '';
  const n = String(name).trim().toLowerCase();
  const p = cache.people.find(x => x.name.toLowerCase()===n);
  return p ? p.id : '';
}
function findPropertyByName(name) {
  if (!name) return '';
  const n = String(name).trim().toLowerCase();
  const p = cache.properties.find(x => x.name.toLowerCase()===n);
  return p ? p.id : '';
}
function findPondByName(name) {
  const n = String(name||'').trim().toLowerCase();
  const p = cache.fishPonds.find(x => x.name.toLowerCase()===n);
  return p ? p.id : '';
}

async function parseTableFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.json')) {
    const obj = JSON.parse(await file.text());
    return { kind:'json', obj };
  }
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
    const buf = await file.arrayBuffer();
    const files = await unzip(buf);
    const sheets = {};
    const wb = new TextDecoder().decode(files['xl/workbook.xml']||new Uint8Array());
    const sheetNames = [...wb.matchAll(/<sheet[^>]*name="([^"]+)"/g)].map(m=>m[1]);
    let shared = [];
    if (files['xl/sharedStrings.xml']) {
      const ss = new TextDecoder().decode(files['xl/sharedStrings.xml']);
      shared = [...ss.matchAll(/<t[^>]*>([^<]*)<\/t>/g)].map(m=>m[1]);
    }
    for (let i=0;i<sheetNames.length;i++) {
      const xml = new TextDecoder().decode(files['xl/worksheets/sheet'+(i+1)+'.xml']||new Uint8Array());
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const grid = [];
      for (const row of doc.getElementsByTagName('row')) {
        const cells = {};
        for (const c of row.getElementsByTagName('c')) {
          const ref = c.getAttribute('r')||'';
          const col = ref.replace(/[0-9]/g,'');
          const t = c.getAttribute('t');
          let v='';
          if (t==='s') { const vi=c.getElementsByTagName('v')[0]; v = shared[num(vi && vi.textContent)]||''; }
          else if (t==='inlineStr') { const ti=c.getElementsByTagName('t')[0]; v = ti?ti.textContent:''; }
          else { const vi=c.getElementsByTagName('v')[0]; v = vi?vi.textContent:''; }
          cells[col]=v;
        }
        grid.push(cells);
      }
      if (!grid.length) continue;
      const cols = Object.keys(grid[0]).sort((a,b)=>a.length-b.length || a.localeCompare(b));
      const headers = cols.map(c => grid[0][c]||c);
      const rows = grid.slice(1).map(g => { const o={}; cols.forEach((c,i)=>o[headers[i]]=g[c]==null?'':g[c]); return o; });
      sheets[sheetNames[i]||('Sheet'+(i+1))] = { headers, rows };
    }
    return { kind:'xlsx', sheets };
  }
  const text = await file.text();
  return { kind:'csv', sheets: { [file.name.replace(/\.[^.]+$/,'')]: parseCsv(text) } };
}

function classifySheet(name, headers) {
  const h = headers.map(normKey).join('|');
  const n = normKey(name);
  if (n.includes('stock price') || (h.includes('current price') && h.includes('symbol') && !h.includes('quantity'))) return 'prices';
  if (n.includes('transaction') || h.includes('transaction type')) return 'transactions';
  if (n.includes('coconut harvest')) return 'coco';
  if (n.includes('paddy harvest')) return 'paddy';
  if (n.includes('fish harvest')) return 'fishHarvest';
  if (n.includes('fish stocking')) return 'fishStock';
  if (n.includes('fish monthly') || (n.includes('fish') && h.includes('category'))) return 'fishExp';
  if (n.includes('fish pond')) return 'ponds';
  if (n.includes('agricultural expense')) return 'agriExp';
  if (n.includes('propert') && h.includes('survey')) return 'properties';
  if (n.includes('land segment')) return 'segments';
  if (n.includes('watchlist')) return 'watch';
  if (h.includes('current price') && h.includes('symbol')) return 'prices';
  return 'unknown';
}

function previewImport(kind, sheet) {
  const valid=[], invalid=[];
  for (let i=0;i<sheet.rows.length;i++) {
    const r = sheet.rows[i];
    const issues=[];
    if (kind==='prices') {
      if (!rowGet(r,'Symbol','symbol')) issues.push('Missing symbol');
      if (!(num(rowGet(r,'Current Price','current price','Price'))>=0)) issues.push('Bad price');
    } else if (kind==='transactions') {
      if (!rowGet(r,'Symbol')) issues.push('Missing symbol');
      if (!['BUY','SELL','Buy','Sell'].includes(String(rowGet(r,'Transaction Type','Type')))) issues.push('Type must be BUY or SELL');
      if (num(rowGet(r,'Quantity'))<=0) issues.push('Quantity');
    } else if (kind==='coco') {
      if (num(rowGet(r,'Number of Coconuts','Coconuts'))<0) issues.push('Coconuts');
    } else if (kind==='paddy') {
      if (num(rowGet(r,'Quantity'))<0) issues.push('Quantity');
    } else if (kind==='fishHarvest') {
      if (!rowGet(r,'Pond')) issues.push('Pond');
      if (num(rowGet(r,'Quantity'))<=0) issues.push('Quantity');
    }
    if (issues.length) invalid.push({ i:i+2, issues, r }); else valid.push(r);
  }
  return { valid, invalid };
}

async function applyImport(kind, valid) {
  let n=0;
  if (kind==='prices') {
    for (const r of valid) {
      const symbol = String(rowGet(r,'Symbol')).trim().toUpperCase();
      const company = rowGet(r,'Company') || (cache.securities[symbol]||{}).company || symbol;
      const sec = upsertSecurityFields(symbol, {
        company, currentPrice: num(rowGet(r,'Current Price','Price')),
        marketCap: rowGet(r,'Market Cap'), updatedDate: rowGet(r,'Updated Date') || today()
      });
      await put('securities', sec); n++;
    }
    await logActivity('import_performed','prices','', n+' prices updated');
    return n+' market prices updated. Quantities and buy prices were not changed.';
  }
  if (kind==='transactions') {
    for (const r of valid) {
      let personId = findPersonByName(rowGet(r,'Person'));
      if (!personId && cache.people[0]) personId = cache.people[0].id;
      const type = String(rowGet(r,'Transaction Type','Type')).toUpperCase()==='SELL'?'SELL':'BUY';
      await saveTx({
        personId, company: rowGet(r,'Company'), symbol: rowGet(r,'Symbol'), type,
        date: rowGet(r,'Date')||today(), quantity: rowGet(r,'Quantity'), price: rowGet(r,'Price'),
        charges: rowGet(r,'Charges'), notes: rowGet(r,'Notes')
      }); n++;
    }
    return n+' transactions imported.';
  }
  if (kind==='coco') {
    for (const r of valid) {
      const propertyId = findPropertyByName(rowGet(r,'Property')) || cache.properties[0]?.id;
      const person = findPersonByName(rowGet(r,'Person'));
      const l1t = /per/i.test(rowGet(r,'Labor 1 Type')) ? 'per_unit' : 'total';
      const l2t = /per/i.test(rowGet(r,'Labor 2 Type')) ? 'per_unit' : 'total';
      await saveCoco({
        propertyId, harvestDate: rowGet(r,'Harvest Date','Date')||today(),
        coconuts: rowGet(r,'Number of Coconuts','Coconuts'), pricePerCoconut: rowGet(r,'Price Per Coconut','Price'),
        labor1Type: l1t, labor1Value: rowGet(r,'Labor 1','Labor 1 Value'),
        labor2Type: l2t, labor2Value: rowGet(r,'Labor 2','Labor 2 Value'),
        transport: rowGet(r,'Transport'), other: rowGet(r,'Other'),
        allocations: person ? [{ personId: person, pct: num(rowGet(r,'Allocation'))||100 }] : defaultAlloc(),
        notes: rowGet(r,'Notes')
      }); n++;
    }
    return n+' coconut harvests imported.';
  }
  if (kind==='paddy') {
    for (const r of valid) {
      await savePaddyH({
        propertyId: findPropertyByName(rowGet(r,'Property'))||cache.properties[0]?.id,
        harvestDate: rowGet(r,'Harvest Date','Date')||today(), quantity: rowGet(r,'Quantity'),
        unit: rowGet(r,'Unit')||'bags', price: rowGet(r,'Price'), notes: rowGet(r,'Notes'),
        allocations: findPersonByName(rowGet(r,'Person')) ? [{personId:findPersonByName(rowGet(r,'Person')), pct: num(rowGet(r,'Allocation'))||100}] : defaultAlloc()
      }); n++;
    }
    return n+' paddy harvests imported.';
  }
  if (kind==='fishHarvest') {
    for (const r of valid) {
      let pondId = findPondByName(rowGet(r,'Pond'));
      if (!pondId) { const pond = await savePond({ name: rowGet(r,'Pond'), status:'Active', allocations: defaultAlloc() }); pondId = pond.id; await loadAll(); }
      await saveFishHarvest({
        pondId, harvestDate: rowGet(r,'Harvest Date','Date')||today(), fishType: rowGet(r,'Fish Type'),
        quantity: rowGet(r,'Quantity'), unit: rowGet(r,'Unit')||'kg', pricePerKg: rowGet(r,'Price Per Kg','Price'),
        commission: rowGet(r,'Commission'), transport: rowGet(r,'Transport'), otherSelling: rowGet(r,'Other Selling Expenses','Other'),
        notes: rowGet(r,'Notes'), allocations: defaultAlloc()
      }); n++;
    }
    return n+' fish harvests imported.';
  }
  if (kind==='ponds') {
    for (const r of valid) { await savePond({ name: rowGet(r,'Pond','Name'), location: rowGet(r,'Location'), size: rowGet(r,'Size'), status: rowGet(r,'Status')||'Active', allocations: defaultAlloc(), notes: rowGet(r,'Notes') }); n++; }
    return n+' ponds imported.';
  }
  if (kind==='fishStock') {
    for (const r of valid) {
      let pondId = findPondByName(rowGet(r,'Pond')); if (!pondId) continue;
      await saveStocking({ pondId, date: rowGet(r,'Date')||today(), fishType: rowGet(r,'Fish Type'), numberIntroduced: rowGet(r,'Number Introduced'), pricePerFish: rowGet(r,'Price Per Fish'), supplier: rowGet(r,'Supplier'), notes: rowGet(r,'Notes'), allocations: defaultAlloc() }); n++;
    }
    return n+' stocking rows imported.';
  }
  if (kind==='fishExp') {
    for (const r of valid) {
      let pondId = findPondByName(rowGet(r,'Pond')); if (!pondId) continue;
      await saveFishExp({ pondId, date: rowGet(r,'Date')||today(), category: rowGet(r,'Category')||'Other', amount: rowGet(r,'Amount'), notes: rowGet(r,'Notes'), allocations: defaultAlloc() }); n++;
    }
    return n+' pond expenses imported.';
  }
  if (kind==='agriExp') {
    for (const r of valid) {
      await saveAgriExp({ date: rowGet(r,'Date')||today(), propertyId: findPropertyByName(rowGet(r,'Property')), crop: rowGet(r,'Crop')||'Other', category: rowGet(r,'Category')||'Other', amount: rowGet(r,'Amount'), notes: rowGet(r,'Notes'), allocations: defaultAlloc() }); n++;
    }
    return n+' agricultural expenses imported.';
  }
  throw new Error('This sheet type is not recognized. Use a template or export first.');
}

function showImportPreview(fileLabel, kind, preview) {
  const inv = preview.invalid.slice(0,12).map(x => `Row ${x.i}: ${x.issues.join(', ')}`).join('<br>');
  openModal('Import preview', fileLabel, `<div class="warn-banner">${preview.valid.length} valid rows · ${preview.invalid.length} invalid. Nothing has been written yet.</div>
    <p class="hint">Kind: ${esc(kind)}</p>${inv?`<p class="error-text">${inv}</p>`:''}`,
    btn('Cancel',{act:'close-modal'})+btn('Import '+preview.valid.length+' rows',{cls:'primary',act:'import-confirm'}));
  $('#modal-root').querySelector('[data-act="import-confirm"]').onclick = async () => {
    try {
      const msg = await applyImport(kind, preview.valid);
      closeModal(); await refresh(); toast(msg);
    } catch (err) { toast(err.message||String(err), 'err'); }
  };
}

async function handleImportFile(file, forcePrices) {
  if (!file) return;
  try {
    const parsed = await parseTableFile(file);
    if (parsed.kind==='json') {
      const obj = parsed.obj;
      if (obj.app !== APP && obj.app !== 'FamilyWealthManager') throw new Error('This JSON is not a Family Wealth backup.');
      const counts = obj.recordCounts || {};
      const list = Object.entries(counts).map(([k,v])=>`${k}: ${v}`).join(' · ');
      openModal('Restore backup', '', `<div class="warn-banner">This replaces the ledger on this device with the backup. Export a fresh backup first if you might need the current data.</div>
        <div class="stat-line"><span>Backup date</span><span>${esc(obj.exportedAt||'')}</span></div>
        <div class="stat-line"><span>App version</span><span>${esc(obj.appVersion||'')}</span></div>
        <div class="stat-line"><span>DB version</span><span>${esc(obj.dbVersion||'')}</span></div>
        <p class="hint">${esc(list)}</p>
        <label class="field"><input type="checkbox" id="restore-ok"/> I understand existing records will be replaced</label>`,
        btn('Cancel',{act:'close-modal'})+btn('Restore',{cls:'danger',act:'do-restore'}));
      $('#modal-root').querySelector('[data-act="do-restore"]').onclick = async () => {
        if (!$('#restore-ok').checked) { toast('Tick the confirmation box'); return; }
        await restoreFromObject(obj);
        closeModal(); await refresh(); toast('Backup restored');
      };
      return;
    }
    const sheetNames = Object.keys(parsed.sheets);
    let chosen = parsed.sheets[sheetNames[0]];
    let kind = forcePrices ? 'prices' : classifySheet(sheetNames[0], chosen.headers);
    if (forcePrices) {
      const hit = sheetNames.find(n => classifySheet(n, parsed.sheets[n].headers)==='prices') || sheetNames.find(n => parsed.sheets[n].headers.some(h=>/symbol/i.test(h)));
      if (hit) { chosen = parsed.sheets[hit]; kind='prices'; }
    }
    const preview = previewImport(kind, chosen);
    showImportPreview(file.name+' · '+sheetNames[0], kind, preview);
  } catch (err) { toast(err.message||String(err), 'err'); }
}

async function restoreFromObject(obj) {
  const data = obj.data || {};
  const names = STORES.map(s=>s[0]).filter(n => n!=='meta');
  const t = db.transaction(names, 'readwrite');
  for (const n of names) t.objectStore(n).clear();
  await txDone(t);
  const putArr = async (store, arr) => { if (arr && arr.length) await putMany(store, arr); };
  await putArr('people', data.people);
  await putArr('securities', data.securities);
  await putArr('transactions', data.transactions);
  await putArr('holdingsMeta', data.holdingsMeta);
  await putArr('watchlist', data.watchlist);
  await putArr('theses', data.theses);
  await putArr('reminders', data.reminders);
  await putArr('properties', data.properties);
  await putArr('ownership', data.ownership);
  await putArr('segments', data.segments);
  await putArr('coconutTrees', data.coconutTrees);
  await putArr('coconutHarvests', data.coconutHarvests);
  await putArr('paddyHarvests', data.paddyHarvests);
  await putArr('agriExpenses', data.agriExpenses);
  await putArr('fishPonds', data.fishPonds);
  await putArr('fishStocking', data.fishStocking);
  await putArr('fishExpenses', data.fishExpenses);
  await putArr('fishHarvests', data.fishHarvests);
  await putArr('propertyHistory', data.propertyHistory);
  await putArr('activity', data.activity);
  await putArr('settings', data.settings);
  await logActivity('backup_restored','backup','', 'Restored backup from '+(obj.exportedAt||''));
}

function pickFile(accept) {
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type='file'; inp.accept = accept || '.csv,.xlsx,.xls,.json,.txt';
    inp.onchange = () => resolve(inp.files[0]||null);
    inp.click();
  });
}
ACTIONS['import-prices'] = async () => { const f = await pickFile('.csv,.xlsx,.xls,.txt'); await handleImportFile(f, true); };
ACTIONS['import-file'] = async () => { const f = await pickFile(); await handleImportFile(f, false); };
ACTIONS['restore-backup'] = async () => { const f = await pickFile('.json'); await handleImportFile(f, false); };

document.addEventListener('click', async (e) => {

  const t = e.target.closest('[data-go],[data-act],[data-view]');
  if (e.target.closest('#people-panel') || e.target.closest('#dd-people .dd-panel')) {}
  else { const p = $('#people-panel'); if (p) p.remove(); }
  if (!t) return;
  if (t.dataset.go) {
    if (t.dataset.go === 'more') { go('statistics'); }
    else go(t.dataset.go);
    $('#sidebar').classList.remove('open');
    $('#sidebar-backdrop').hidden = true;
    $('#search-overlay').hidden = true;
    return;
  }
  if (t.dataset.view) {
    state.viewMode = t.dataset.view;
    await setSetting('viewMode', state.viewMode);
    await refresh();
    return;
  }
  const act = t.dataset.act;
  if (act === 'close-modal') closeModal();
  if (act === 'menu') { $('#sidebar').classList.add('open'); $('#sidebar-backdrop').hidden = false; }
  if (act === 'search') openSearch();
  if (act === 'toggle-privacy') {
    state.privacy = !state.privacy;
    await setSetting('privacyMode', state.privacy);
    await refresh();
  }
  if (act === 'lock-now') await lockApp();
  if (act === 'toggle-people') {
    const host = $('#dd-people');
    if ($('#people-panel')) { $('#people-panel').remove(); return; }
    host.insertAdjacentHTML('beforeend', peoplePanel());
  }
  if (act === 'toggle-asset') {
    const host = $('#dd-asset');
    if (host.querySelector('.dd-panel')) { host.querySelector('.dd-panel').remove(); return; }
    host.insertAdjacentHTML('beforeend', assetPanel());
    return;
  }
  if (typeof ACTIONS[act] === 'function') {
    try { await ACTIONS[act](t); } catch (err) { toast(err.message || String(err), 'err'); }
  }
});
document.addEventListener('change', async (e) => {
  const pe = e.target.dataset && e.target.dataset.people;
  if (pe) {
    if (pe === 'ALL') state.peopleFilter = 'ALL';
    else {
      let cur = state.peopleFilter === 'ALL' ? [] : (state.peopleFilter||[]).slice();
      if (e.target.checked) cur.push(pe); else cur = cur.filter(x => x!==pe);
      state.peopleFilter = cur.length ? cur : 'ALL';
    }
    await setSetting('peopleFilter', state.peopleFilter);
    await refresh();
    return;
  }
  if (e.target.name === 'assetType') {
    state.assetType = e.target.value;
    await setSetting('assetType', state.assetType);
    await refresh();
  }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === '/' || (e.metaKey && e.key==='k') || (e.ctrlKey && e.key==='k')) && !/input|textarea|select/i.test(e.target.tagName)) {
    e.preventDefault(); openSearch();
  }
  if (e.key === 'Escape') { closeModal(); $('#search-overlay').hidden = true; $('#sidebar').classList.remove('open'); $('#sidebar-backdrop').hidden = true; }
});
$('#sidebar-backdrop')?.addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#sidebar-backdrop').hidden = true; });
window.addEventListener('hashchange', () => refresh());

async function init() {
  try {
    db = await openDb(DB_NAME, DB_VERSION);
    await loadAll();
    if (!cache.settings.installedAt) await setSetting('installedAt', nowIso());
    if (!cache.settings.appVersion) await setSetting('appVersion', APP_VERSION);
    state = {
      privacy: !!cache.settings.privacyMode,
      peopleFilter: cache.settings.peopleFilter || 'ALL',
      assetType: cache.settings.assetType || 'all',
      viewMode: cache.settings.viewMode || 'individual',
      locked: !!cache.settings.locked,
      pageSize: PAGE_SIZE
    };
    applyTheme();
    $('#boot').hidden = true;
    if (cache.settings.pinHash && (cache.settings.locked || cache.settings.lockOnStart)) {
      showLock();
    } else {
      $('#app').hidden = false;
      await refresh();
    }
  } catch (err) {
    $('#boot').textContent = 'Could not open the local database: ' + (err.message||err);
  }
}
window.FWM = { formatINR, coconutCalc, fishHarvestCalc, pondCosts, computeHoldings, remainingQty, totalCents, formatArea, allocShare, APP_VERSION, snapshotStats, getCache: () => cache, getState: () => state, closeDb: () => db && db.close() };
init();
})();
</script>
